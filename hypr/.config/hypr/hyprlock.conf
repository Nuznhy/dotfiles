# Rosé Pine lock screen. Unlock with your normal login password.
general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(191724)
}

label {
    monitor =
    text = $TIME
    color = rgb(e0def4)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 60
    outline_thickness = 2
    outer_color = rgb(c4a7e7)
    inner_color = rgb(1f1d2e)
    font_color = rgb(e0def4)
    check_color = rgb(9ccfd8)
    fail_color = rgb(eb6f92)
    placeholder_text = Password
    rounding = 10
    position = 0, 0
    halign = center
    valign = center
}
