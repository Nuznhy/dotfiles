# Generated by Quickshell. Disable Hyprlock sync to restore the previous config.
general {
    hide_cursor = true
}

background {
    monitor =
    path = 
    color = rgb(282828)
    blur_passes = 0
}

# Opaque panel keeps the clock and warnings readable over any picture/color.
shape {
    monitor =
    size = 480, 420
    color = rgb(282828)
    rounding = 24
    position = 0, 40
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = $TIME
    color = rgb(d5c4a1)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 320, 60
    outline_thickness = 2
    outer_color = rgb(d3869b)
    inner_color = rgb(3c3836)
    font_color = rgb(d5c4a1)
    font_family = JetBrainsMono Nerd Font
    check_color = rgb(8ec07c)
    fail_color = rgb(fb4934)
    capslock_color = rgb(fabd2f)
    bothlock_color = rgb(fabd2f)
    fade_on_empty = false
    placeholder_text = Password
    rounding = 10
    position = 0, 30
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = Keyboard layout: $LAYOUT
    color = rgb(fabd2f)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:500] python3 /home/mnuzhnyi/dotfiles/quickshell/.config/quickshell/scripts/hyprlock-status.py
    color = rgb(fabd2f)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -80
    halign = center
    valign = center
    zindex = 1
}
