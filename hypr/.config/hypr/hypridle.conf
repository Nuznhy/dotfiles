# Lock on loginctl requests and before sleep. Lid closing is bound in binds.lua.
# No inactivity timers: this only changes locking on lid close and sleep.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    inhibit_sleep = 3
}
