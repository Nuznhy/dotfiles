set -a terminal-features "screen256color:RGB"
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g mouse on
set -g focus-events on
set -g history-limit 99999
set -g extended-keys on
set -g extended-keys-format csi-u

# Theme colors (Rosé Pine fallback when Quickshell sync is disabled).
source-file -F "#{d:current_file}/theme.conf"

# General UI
set -g status on
set -g status 2
set -g status-position top
set -g status-justify centre

# Left / right status
set -g status-left-length 40

set -g status-right-length 80

# Activity
set -g visual-activity off
set -g status-format[1] "#[bg=default] "

# Keybinds
bind r source-file "~/.config/tmux/tmux.conf" \; display-message "tmux.conf reloaded"
bind f display-popup -E -w 80% -h 80% "~/.config/tmux/tmux-session-dispensary.sh"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key t display-popup -E -w 80% -h 80% "$SHELL"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
